name: Weekly data

# The Oil Bulletin appears on Thursday mornings and DESNZ publishes on Thursdays
# too; 13:00 UTC leaves both of them room.
#
# Note for public repositories: GitHub disables scheduled workflows after 60
# days without repository activity, with an email first. One click on "Enable
# workflow" brings it back.
on:
  schedule:
    - cron: "0 13 * * 4"
  workflow_dispatch:

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Tests
        run: uv run pytest -q

      # Fails hard if a worksheet no longer looks the way it should, or if the
      # bulletin is more than ten days old. The last committed data then stays
      # online instead of wrong numbers going live.
      - name: Build data
        run: uv run python -m pipeline.build

      - name: Build geometry
        run: uv run python -m pipeline.geo

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            WEEK=$(python -c "import json;print(json.load(open('web/public/data/latest.json'))['week'])")
            git commit -m "Data: week of $WEEK"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The commit above does not trigger the deploy by itself, so it is called here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
