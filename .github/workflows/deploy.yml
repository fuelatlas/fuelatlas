name: Deploy

# Reusable (workflow_call) as well, because a push made by a workflow using the
# default GITHUB_TOKEN deliberately does not trigger further workflows. The
# weekly run therefore calls this one directly instead of relying on its commit
# to set the deploy off.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "scripts/**"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
