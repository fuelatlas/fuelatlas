[project]
name = "fuelatlas"
version = "0.1.0"
description = "European fuel prices with taxes and duties stripped out"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
